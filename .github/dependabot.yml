version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      pip-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/packages/mls-wasm"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      api-docker-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      api-docker-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      web-docker-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-docker-major:
        patterns: ["*"]
        update-types: ["major"]
