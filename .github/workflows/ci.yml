name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  api_security:
    name: API + security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: sudoku, POSTGRES_USER: sudoku, POSTGRES_PASSWORD: sudoku-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sudoku -d sudoku" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sudoku:sudoku-ci@127.0.0.1:5432/sudoku
      REDIS_URL: redis://127.0.0.1:6379/0
      PUBLIC_ORIGIN: https://sudoku.test
      SESSION_COOKIE_NAME: sudoku_session
      SESSION_TTL_DAYS: "30"
      SECURE_COOKIES: "true"
      S3_BUCKET: sudoku-assets
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: sudoku-ci
      S3_SECRET_ACCESS_KEY: sudoku-ci-secret
      WEB_PUSH_ALLOWED_HOSTS: push.apple.com,fcm.googleapis.com,push.services.mozilla.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install API + tests
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.lock
          grep -E '^[a-zA-Z0-9_.-]+==' apps/api/requirements.lock | sed 's/ \\$//' > /tmp/api-runtime-constraints.txt
          python -m pip install -c /tmp/api-runtime-constraints.txt -e "./apps/api[test]"
          python -m pip check
      - name: Start S3 test service
        run: |
          moto_server -H 127.0.0.1 -p 9000 >/tmp/moto-s3.log 2>&1 &
          python - <<'PY'
          import time, boto3
          s3=boto3.client("s3",endpoint_url="http://127.0.0.1:9000",region_name="us-east-1",aws_access_key_id="sudoku-ci",aws_secret_access_key="sudoku-ci-secret")
          for _ in range(60):
              try: s3.list_buckets(); break
              except Exception: time.sleep(1)
          else: raise SystemExit("S3 test service did not start")
          s3.create_bucket(Bucket="sudoku-assets")
          PY
      - name: Compile API and migrations
        working-directory: apps/api
        run: python -m compileall -q app alembic
      - name: Python lint
        run: ruff check apps/api/app apps/api/alembic tests/api tests/browser tests/ops scripts/security-audit.py
      - name: Security audit scanner tests
        run: pytest -q tests/ops/test_security_audit.py
      - name: Deterministic security audit
        run: |
          git fetch --unshallow 2>/dev/null || git fetch --all --tags
          set +e
          python scripts/security-audit.py . \
            --report security-audit-report.md \
            --json security-audit-report.json
          code=$?
          set -e
          test -s security-audit-report.md
          test -s security-audit-report.json
          cat security-audit-report.md
          if [ "$code" -ge 2 ]; then
            exit "$code"
          fi
      - name: Retain security audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-audit-report.md
            security-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Python dependency audit
        run: pip-audit --local
      - name: Legacy phone + singleton-admin migration upgrade regression
        env: { PYTHONPATH: apps/api }
        run: python tests/ops/phone_migration_upgrade.py
      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head
      - name: API integration tests
        env: { PYTHONPATH: apps/api }
        run: pytest -q tests/api
      - name: Operations unit regressions
        run: python -m unittest discover -s tests/ops

  crypto:
    name: OpenMLS + Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - name: Test and build pinned OpenMLS browser package
        run: |
          rustup toolchain install 1.91.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.91.0 test --manifest-path packages/mls-wasm/Cargo.toml --lib --locked
          npm run build:mls-wasm
          test -s apps/web/generated/mls-wasm/sudoku_mls_wasm_bg.wasm
          test -s apps/web/generated/mls-wasm/sudoku_mls_wasm.js
          test -s apps/web/generated/mls-wasm/sudoku_mls_wasm.d.ts
      - name: Retain generated OpenMLS browser package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mls-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/generated/mls-wasm/
          if-no-files-found: error
          retention-days: 1
      - name: Rust dependency audit
        run: |
          cargo +1.91.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.91.0 audit --file packages/mls-wasm/Cargo.lock

  web_static:
    name: Web build + static regressions
    needs: crypto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore generated OpenMLS browser package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mls-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/generated/mls-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - name: Install web dependencies
        run: |
          test -s package-lock.json
          node -e "const l=require('./package-lock.json'); if ((l.lockfileVersion ?? 0) < 1) process.exit(1)"
          npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: UI class contract
        run: |
          node --test scripts/check-web-ui-contract.test.mjs
          node scripts/check-web-ui-contract.mjs
      - name: Web lint
        run: npm --workspace @sudoku/web run lint
      - name: Domain tests
        run: npm run test:domain
      - name: Build domain declarations
        run: npm --workspace @sudoku/domain run build
      - name: Sudoku save migration regression
        run: node --experimental-strip-types --test scripts/sudoku-saved-game.test.mjs
      - name: Messenger refresh queue regression
        run: node --experimental-strip-types --test scripts/refresh-queue.test.mjs
      - name: Web lifecycle and storage regressions
        run: |
          node --test scripts/bounded-download.test.mjs scripts/bundle-budget.test.mjs scripts/upload-transport.test.mjs
          node --experimental-strip-types --test scripts/realtime-client.test.mjs scripts/session-concealment.test.mjs scripts/browser-state-store.test.mjs
      - name: Web typecheck
        run: npm --workspace @sudoku/web run typecheck
      - name: Web production build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
        run: npm run build:web
      - name: Web performance budget
        run: node scripts/check-web-bundle-budget.mjs
      - name: Measure controlled messenger performance
        env:
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p audit-performance
          for sample in 1 2 3; do
            node scripts/profile-messenger.mjs "audit-performance/profile-${sample}.json"
          done
          node scripts/check-web-bundle-budget.mjs > audit-performance/bundle.json
      - name: Retain web performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-performance/
          if-no-files-found: ignore
          retention-days: 14

  browser_e2e:
    name: Browser E2E
    needs: crypto
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: sudoku, POSTGRES_USER: sudoku, POSTGRES_PASSWORD: sudoku-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sudoku -d sudoku" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sudoku:sudoku-ci@127.0.0.1:5432/sudoku
      REDIS_URL: redis://127.0.0.1:6379/0
      PUBLIC_ORIGIN: https://sudoku.test
      SESSION_COOKIE_NAME: sudoku_session
      SESSION_TTL_DAYS: "30"
      SECURE_COOKIES: "true"
      S3_BUCKET: sudoku-assets
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: sudoku-ci
      S3_SECRET_ACCESS_KEY: sudoku-ci-secret
      WEB_PUSH_ALLOWED_HOSTS: push.apple.com,fcm.googleapis.com,push.services.mozilla.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore generated OpenMLS browser package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mls-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/generated/mls-wasm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install API + browser test dependencies
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.lock
          grep -E '^[a-zA-Z0-9_.-]+==' apps/api/requirements.lock | sed 's/ \\$//' > /tmp/api-runtime-constraints.txt
          python -m pip install -c /tmp/api-runtime-constraints.txt -e "./apps/api[test]"
          python -m pip check
      - name: Start S3 test service
        run: |
          moto_server -H 127.0.0.1 -p 9000 >/tmp/moto-s3.log 2>&1 &
          python - <<'PY'
          import time, boto3
          s3=boto3.client("s3",endpoint_url="http://127.0.0.1:9000",region_name="us-east-1",aws_access_key_id="sudoku-ci",aws_secret_access_key="sudoku-ci-secret")
          for _ in range(60):
              try: s3.list_buckets(); break
              except Exception: time.sleep(1)
          else: raise SystemExit("S3 test service did not start")
          s3.create_bucket(Bucket="sudoku-assets")
          PY
      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build domain declarations
        run: npm --workspace @sudoku/domain run build
      - name: Web production build
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
        run: npm run build:web
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Seed browser acceptance users
        env: { PYTHONPATH: apps/api }
        run: python tests/browser/seed_users.py
      - name: Reset browser-test rate limits
        env: { PYTHONPATH: apps/api }
        run: python tests/browser/reset_rate_limits.py
      - name: Browser E2E acceptance
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          PUBLIC_ORIGIN=http://127.0.0.1:3000 SECURE_COOKIES=false PYTHONPATH=apps/api \
            uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8000 >/tmp/sudoku-api-e2e.log 2>&1 &
          API_PID=$!
          API_PROXY_TARGET=http://127.0.0.1:8000 \
            npm --workspace @sudoku/web run start -- --hostname 127.0.0.1 --port 3000 >/tmp/sudoku-web-e2e.log 2>&1 &
          WEB_PID=$!
          cleanup() { kill "$WEB_PID" "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          python - <<'PY'
          import time, urllib.request
          for url in ("http://127.0.0.1:8000/v1/health/ready", "http://127.0.0.1:3000/"):
              for _ in range(90):
                  try:
                      urllib.request.urlopen(url, timeout=2).read()
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"browser acceptance service did not start: {url}")
          PY
          npm --workspace @sudoku/web run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  infra:
    name: Infra + restore + images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: sudoku, POSTGRES_USER: sudoku, POSTGRES_PASSWORD: sudoku-ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sudoku -d sudoku" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sudoku:sudoku-ci@127.0.0.1:5432/sudoku
      REDIS_URL: redis://127.0.0.1:6379/0
      PUBLIC_ORIGIN: https://sudoku.test
      SESSION_COOKIE_NAME: sudoku_session
      SESSION_TTL_DAYS: "30"
      SECURE_COOKIES: "true"
      S3_BUCKET: sudoku-assets
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: sudoku-ci
      S3_SECRET_ACCESS_KEY: sudoku-ci-secret
      WEB_PUSH_ALLOWED_HOSTS: push.apple.com,fcm.googleapis.com,push.services.mozilla.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install API + infrastructure test dependencies
        run: |
          python -m pip install --require-hashes -r apps/api/requirements.lock
          grep -E '^[a-zA-Z0-9_.-]+==' apps/api/requirements.lock | sed 's/ \\$//' > /tmp/api-runtime-constraints.txt
          python -m pip install -c /tmp/api-runtime-constraints.txt -e "./apps/api[test]"
          python -m pip check
      - name: Start S3 test service
        run: |
          moto_server -H 127.0.0.1 -p 9000 >/tmp/moto-s3.log 2>&1 &
          python - <<'PY'
          import time, boto3
          s3=boto3.client("s3",endpoint_url="http://127.0.0.1:9000",region_name="us-east-1",aws_access_key_id="sudoku-ci",aws_secret_access_key="sudoku-ci-secret")
          for _ in range(60):
              try: s3.list_buckets(); break
              except Exception: time.sleep(1)
          else: raise SystemExit("S3 test service did not start")
          s3.create_bucket(Bucket="sudoku-assets")
          PY
      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Validate production operations scripts
        run: |
          bash -n \
            scripts/backup-production.sh \
            scripts/restore-production.sh \
            scripts/preflight-production.sh \
            scripts/smoke-production.sh
          POSTGRES_CI_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          MINIO_ROOT_CI_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          S3_CI_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          VAPID_CI_PRIVATE=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          cat > .env.production.ci <<EOF
          APP_DOMAIN=sudoku.test
          POSTGRES_PASSWORD=$POSTGRES_CI_SECRET
          MINIO_ROOT_USER=ci-minio-root
          MINIO_ROOT_PASSWORD=$MINIO_ROOT_CI_SECRET
          S3_BUCKET=sudoku-assets
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=ci-minio-app
          S3_SECRET_ACCESS_KEY=$S3_CI_SECRET
          VAPID_PUBLIC_KEY=BGtkbcjrO12YMoDuq2sCQeHlu47uPx3SHTgFKZFYiBW8Qr0D9vgyZSZPdw6_4ZFEI9Snk1VEAj2qTYI1I1YxBXE
          VAPID_PRIVATE_KEY=$VAPID_CI_PRIVATE
          VAPID_SUBJECT=mailto:ci@sudoku.test
          REQUIRE_E2EE_NEW_CONVERSATIONS=true
          EOF
          chmod 600 .env.production.ci
          SKIP_DNS=1 ENV_FILE=.env.production.ci bash scripts/preflight-production.sh
          cp .env.production.ci .env.production.bad
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=bad:password:with:reserved:characters:1234567890/' .env.production.bad
          if SKIP_DNS=1 ENV_FILE=.env.production.bad bash scripts/preflight-production.sh; then
            echo "preflight accepted an unsafe POSTGRES_PASSWORD" >&2
            exit 1
          fi
          rm -f .env.production.ci .env.production.bad
      - name: Build pinned MinIO infrastructure images
        run: |
          docker build \
            --file infra/minio/Dockerfile.server \
            --build-arg MINIO_VERSION=RELEASE.2025-10-15T17-29-55Z \
            --tag sudoku-minio-ci .
          docker build \
            --file infra/minio/Dockerfile.mc \
            --build-arg MC_VERSION=RELEASE.2025-08-13T08-35-41Z \
            --tag sudoku-mc-ci .
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' sudoku-minio-ci)" = "RELEASE.2025-10-15T17-29-55Z"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' sudoku-mc-ci)" = "RELEASE.2025-08-13T08-35-41Z"
          docker run --rm sudoku-minio-ci --version >/dev/null
          docker run --rm sudoku-mc-ci --version >/dev/null
      - name: Verify conditional uploads against pinned MinIO
        env:
          AUDIT_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run -d --name sudoku-minio-upload-audit \
            -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=audit-local \
            -e MINIO_ROOT_PASSWORD=audit-local-secret \
            sudoku-minio-ci server /data
          trap 'docker rm -f sudoku-minio-upload-audit >/dev/null' EXIT
          python tests/ops/minio_conditional_upload.py
          python tests/ops/isolated_restore_audit.py
      - name: Retain restore audit measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restore-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-performance/
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate production Compose merge
        env:
          APP_DOMAIN: sudoku.example.com
          POSTGRES_PASSWORD: ci-db
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          S3_ACCESS_KEY_ID: ci-key
          S3_SECRET_ACCESS_KEY: ci-secret
          VAPID_PUBLIC_KEY: ci-public
          VAPID_PRIVATE_KEY: ci-private
          VAPID_SUBJECT: mailto:admin@example.com
        run: |
          docker compose -f compose.yaml -f compose.production.yaml config > /tmp/production-compose.yml
          docker compose -f compose.yaml -f compose.production.yaml config --format json > /tmp/production-compose.json
          python - <<'PY'
          import json
          with open("/tmp/production-compose.json", encoding="utf-8") as handle:
              config = json.load(handle)
          services = config["services"]
          caddy_ports = sorted(str(item["published"]) for item in services["caddy"].get("ports", []))
          if caddy_ports != ["443", "80"]:
              raise SystemExit(f"unexpected production Caddy published ports: {caddy_ports}")
          for service_name in ("postgres", "redis", "minio", "minio-init", "api", "worker", "beat", "web"):
              ports = services[service_name].get("ports", [])
              if ports:
                  raise SystemExit(f"production service {service_name} unexpectedly publishes ports: {ports}")
          PY
          grep -q 'PUBLIC_ORIGIN: https://sudoku.example.com' /tmp/production-compose.yml
          grep -q 'SECURE_COOKIES: "true"' /tmp/production-compose.yml
          grep -q 'REQUIRE_E2EE_NEW_CONVERSATIONS: "true"' /tmp/production-compose.yml
          grep -q 'S3_ENDPOINT_URL: http://minio:9000' /tmp/production-compose.yml
          grep -q 'S3_PUBLIC_ENDPOINT_URL: https://assets.sudoku.example.com' /tmp/production-compose.yml
          grep -q 'S3_ALLOWED_ORIGIN: https://sudoku.example.com' /tmp/production-compose.yml
          grep -q 'no-new-privileges:true' /tmp/production-compose.yml
          if grep -Eq 'image: .*:latest([[:space:]]|$)' /tmp/production-compose.yml; then
            echo "unpinned :latest image leaked into production config" >&2
            exit 1
          fi
          if grep -q 'PUBLIC_ORIGIN: http://localhost:8080' /tmp/production-compose.yml; then
            echo "local origin leaked into production config" >&2
            exit 1
          fi
      - name: Build production application images
        run: |
          docker build --file apps/api/Dockerfile --tag sudoku-api-ci .
          docker build --file apps/web/Dockerfile --tag sudoku-web-ci .
          test "$(docker inspect --format '{{.Config.User}}' sudoku-api-ci)" = "sudoku"
          test "$(docker inspect --format '{{.Config.User}}' sudoku-web-ci)" = "node"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [api_security, crypto, web_static, browser_e2e, infra]
    steps:
      - name: Require all parallel CI shards
        env:
          API_SECURITY: ${{ needs.api_security.result }}
          CRYPTO: ${{ needs.crypto.result }}
          WEB_STATIC: ${{ needs.web_static.result }}
          BROWSER_E2E: ${{ needs.browser_e2e.result }}
          INFRA: ${{ needs.infra.result }}
        run: |
          printf 'api_security=%s\ncrypto=%s\nweb_static=%s\nbrowser_e2e=%s\ninfra=%s\n' \
            "$API_SECURITY" "$CRYPTO" "$WEB_STATIC" "$BROWSER_E2E" "$INFRA"
          test "$API_SECURITY" = success
          test "$CRYPTO" = success
          test "$WEB_STATIC" = success
          test "$BROWSER_E2E" = success
          test "$INFRA" = success
