name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run test:domain
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm --workspace @sudoku/domain run build
      - run: npm --workspace @sudoku/web run typecheck
      - run: npm --workspace @sudoku/web run build
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sudoku
          POSTGRES_PASSWORD: sudoku
          POSTGRES_DB: sudoku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sudoku -d sudoku"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sudoku:sudoku@localhost:5432/sudoku
      REDIS_URL: redis://localhost:6379/0
      SECURE_COOKIES: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tests migrations
      - run: alembic upgrade head
      - run: PYTHONPATH=. pytest -q tests/test_schema.py
      - run: PYTHONPATH=. pytest -q tests/test_security.py tests/test_auth_integration.py
