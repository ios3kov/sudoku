name: device-pin-targeted-patch
on:
  push:
    branches: [ops/device-pin-targeted-patch]
permissions:
  contents: write
jobs:
  patch-feature-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/device-pin-login
      - name: Complete reviewed integration on the expected feature parent only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7aebb8509a2223520936b6bca0fb8cc534eac599
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('apps/web/features/messenger')
          expected = {'push.ts': '09177954e76340283f42d49d0362f775c1c1cf8b', 'uploads.ts': '69964e6972fc7b4affe6b49993fd7a21640f3a12'}
          for name, digest in expected.items():
              p = root / name
              raw = p.read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == digest, name
              p.write_text('import { privateFetch as fetch } from "./device-access";\n\n' + raw.decode())
          p = root / 'device-sessions.tsx'
          text = p.read_text()
          before = 'import { messengerApi } from "./api";'
          assert text.count(before) == 1 and 'DeviceAccessSettings' not in text
          text = text.replace(before, before + '\nimport { DeviceAccessSettings } from "./device-access-settings";')
          before = '      {error ? <p className="form-error">{error}</p> : null}'
          assert text.count(before) == 1
          text = text.replace(before, '      <DeviceAccessSettings />\n' + before)
          p.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --stat
          node --experimental-strip-types --test scripts/device-access.test.mjs
          git config user.name 'Sudoku implementation workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/features/messenger/push.ts apps/web/features/messenger/uploads.ts apps/web/features/messenger/device-sessions.tsx
          git commit -m 'feat: wire PIN access into Devices, attachments and push requests'
          git push origin HEAD:feat/device-pin-login
