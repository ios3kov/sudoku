name: bootstrap-snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-snapshot.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate snapshot
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/snapshot.b64
          for part in bootstrap/part-*.b64; do
            # part-08-09 accidentally includes the complete 10-11 segment.
            [[ "$part" == "bootstrap/part-10-11.b64" ]] && continue
            tr -d '\r\n\t ' < "$part" >> /tmp/snapshot.b64
          done

          remainder=$(( $(wc -c < /tmp/snapshot.b64) % 4 ))
          [[ "$remainder" -eq 2 ]] && printf '==' >> /tmp/snapshot.b64
          [[ "$remainder" -eq 3 ]] && printf '=' >> /tmp/snapshot.b64
          [[ "$remainder" -ne 1 ]] || { echo "Invalid base64 length" >&2; exit 1; }

          base64 --decode /tmp/snapshot.b64 > /tmp/snapshot.tar.gz

          echo "Recovered snapshot SHA256:"
          sha256sum /tmp/snapshot.tar.gz

          # Gzip CRC + tar parsing are the authoritative integrity checks here.
          # The earlier expected SHA was generated from the broken pre-split export.
          gzip -t /tmp/snapshot.tar.gz
          tar -tzf /tmp/snapshot.tar.gz > /tmp/snapshot-files.txt
          test -s /tmp/snapshot-files.txt

          # Reject path traversal / absolute paths.
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/snapshot-files.txt; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi

          # Require the actual application, not just docs/bootstrap files.
          for required in             "./apps/api/app/main.py"             "./apps/web/app/page.tsx"             "./apps/web/features/messenger/messenger-shell.tsx"             "./packages/domain/src/sudoku.ts"             "./.github/workflows/ci.yml"; do
            grep -Fxq "$required" /tmp/snapshot-files.txt || {
              echo "Missing required snapshot path: $required" >&2
              exit 1
            }
          done

          # Replace the repository tree atomically from the validated archive.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/snapshot.tar.gz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import validated MVP snapshot"
          git push origin HEAD:main
