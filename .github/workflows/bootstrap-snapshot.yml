name: bootstrap-snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-snapshot.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/snapshot.tar.gz
          echo "e1e0b708613b7eff45b41fabf2f05c1470dd96ea65b8cde8330094fb7688c097  /tmp/snapshot.tar.gz" | sha256sum -c -
          tar -xzf /tmp/snapshot.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: import verified MVP snapshot"
          git push origin HEAD:main
