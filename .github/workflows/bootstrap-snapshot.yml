name: bootstrap-snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-snapshot.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified snapshot
        shell: bash
        run: |
          set -euo pipefail

          # part-08-09 accidentally contains the full contents of part-10-11
          # as its second 16k half. Skip the duplicate standalone file.
          : > /tmp/snapshot.b64
          for part in bootstrap/part-*.b64; do
            if [[ "$part" == "bootstrap/part-10-11.b64" ]]; then
              continue
            fi
            tr -d '\r\n\t ' < "$part" >> /tmp/snapshot.b64
          done

          # Restore standard Base64 padding if the original export omitted it.
          remainder=$(( $(wc -c < /tmp/snapshot.b64) % 4 ))
          if [[ "$remainder" -eq 2 ]]; then
            printf '==' >> /tmp/snapshot.b64
          elif [[ "$remainder" -eq 3 ]]; then
            printf '=' >> /tmp/snapshot.b64
          elif [[ "$remainder" -eq 1 ]]; then
            echo "Invalid base64 length" >&2
            exit 1
          fi

          base64 --decode /tmp/snapshot.b64 > /tmp/snapshot.tar.gz
          echo "e1e0b708613b7eff45b41fabf2f05c1470dd96ea65b8cde8330094fb7688c097  /tmp/snapshot.tar.gz" | sha256sum -c -
          tar -tzf /tmp/snapshot.tar.gz > /tmp/snapshot-files.txt
          test -s /tmp/snapshot-files.txt
          tar -xzf /tmp/snapshot.tar.gz -C .

          rm -rf bootstrap .github/workflows/bootstrap-snapshot.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: import verified MVP snapshot"
          git push origin HEAD:main
