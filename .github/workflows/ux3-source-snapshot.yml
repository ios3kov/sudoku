name: ux3-source-snapshot
on:
  push:
    branches: [feat/messenger-ux3]
    paths: [.github/workflows/ux3-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact development refs without credentials
        run: |
          git bundle create /tmp/sudoku-development.bundle \
            refs/remotes/origin/main \
            refs/remotes/origin/fix/preserve-active-composition \
            refs/remotes/origin/feat/messenger-ux3
          git bundle verify /tmp/sudoku-development.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-development-source
          path: /tmp/sudoku-development.bundle
          retention-days: 1
