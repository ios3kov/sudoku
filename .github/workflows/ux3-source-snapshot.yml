name: ux3-source-snapshot
on:
  push:
    branches: [feat/messenger-ux3]
    paths: [.github/workflows/ux3-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/sudoku-ux3-baseline.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ux3-baseline-source
          path: /tmp/sudoku-ux3-baseline.zip
          retention-days: 1
