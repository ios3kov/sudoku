name: ux3-source-snapshot
on:
  push:
    branches: [feat/messenger-ux3]
    paths: [.github/workflows/ux3-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Install pinned verification dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Build existing pinned browser WASM
        run: node scripts/build-mls-wasm.mjs
      - name: Package local verification toolchain (no credentials)
        run: tar -czf /tmp/ux3-toolchain.tar.gz node_modules apps/web/generated/mls-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: ux3-verification-toolchain
          path: /tmp/ux3-toolchain.tar.gz
          retention-days: 1
