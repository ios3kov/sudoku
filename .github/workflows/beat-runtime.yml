name: beat-runtime
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  non-root-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_DOMAIN: sudoku.test
      POSTGRES_PASSWORD: ci-only-postgres
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      S3_ACCESS_KEY_ID: ci-key
      S3_SECRET_ACCESS_KEY: ci-only-secret
      VAPID_PUBLIC_KEY: ci-public
      VAPID_PRIVATE_KEY: ci-private
      VAPID_SUBJECT: mailto:ci@sudoku.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Build the real non-root API and beat image
        run: docker build --file apps/api/Dockerfile --tag sudoku-beat-runtime-ci .
      - name: Resolve production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --format json > /tmp/beat-compose.json
      - name: Reproduce old permissions failure and verify persistent scheduler runtime
        run: python tests/ops/beat_runtime.py /tmp/beat-compose.json sudoku-beat-runtime-ci
