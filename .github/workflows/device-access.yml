name: device-access
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - run: node --experimental-strip-types --test scripts/device-access.test.mjs
