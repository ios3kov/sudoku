name: device-access
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --experimental-strip-types --test scripts/device-access.test.mjs
