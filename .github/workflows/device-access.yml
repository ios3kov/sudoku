name: device-access
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - run: node --experimental-strip-types --test scripts/device-access.test.mjs
