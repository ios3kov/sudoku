name: ios-native

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/generate-ios-project.sh"
      - ".github/workflows/ios-native.yml"
      - "docs/steps/88-native-ios-production-plan.md"
      - "docs/steps/89-ios-biometric-media.md"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/generate-ios-project.sh"
      - ".github/workflows/ios-native.yml"
      - "docs/steps/88-native-ios-production-plan.md"
      - "docs/steps/89-ios-biometric-media.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate Apple plists
        run: |
          plutil -lint ios/Sudoku/Sudoku/Info.plist
          plutil -lint ios/Sudoku/Sudoku/PrivacyInfo.xcprivacy

      - name: Generate Xcode project
        run: bash scripts/generate-ios-project.sh

      - name: Build iOS simulator app
        working-directory: ios/Sudoku
        run: |
          xcodebuild             -project Sudoku.xcodeproj             -scheme Sudoku             -configuration Debug             -sdk iphonesimulator             -destination "generic/platform=iOS Simulator"             CODE_SIGNING_ALLOWED=NO             build

      - name: Test native video preparation
        working-directory: ios/Sudoku
        run: |
          VIDEO_SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcodebuild -project Sudoku.xcodeproj -scheme Sudoku -configuration Debug -destination "platform=iOS Simulator,id=$VIDEO_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
