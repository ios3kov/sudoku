[package]
name = "sudoku-mls-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.0", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
wasm-bindgen = "=0.2.105"

# OpenMLS' RustCrypto provider still has transitive getrandom 0.2 users.
# Enabling the js backend here mirrors the upstream openmls-wasm build.
getrandom_old = { package = "getrandom", version = "=0.2.17", features = ["js"] }
