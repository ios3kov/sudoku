name: Sudoku

options:
  bundleIdPrefix: moscow.sudoku
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Sudoku:
    type: application
    platform: iOS
    sources:
      - path: Sudoku
    resources:
      - path: Sudoku/PrivacyInfo.xcprivacy
      - path: Sudoku/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moscow.sudoku.app
        PRODUCT_NAME: Sudoku
        INFOPLIST_FILE: Sudoku/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WebKit.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: PhotosUI.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: UniformTypeIdentifiers.framework

  SudokuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SudokuTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sudoku

schemes:
  Sudoku:
    build:
      targets:
        Sudoku: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SudokuTests
    archive:
      config: Release
