name: sudoku

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sudoku
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-sudoku-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d sudoku"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile.server
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sudoku-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile.mc
      args:
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sudoku-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
      S3_BUCKET: ${S3_BUCKET:-sudoku-assets}
      S3_ALLOWED_ORIGIN: ${S3_ALLOWED_ORIGIN:-http://localhost:8080}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sudoku-local-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-sudoku-app-secret-change-me}
    volumes:
      - ./infra/minio/cors.template.xml:/config/cors.template.xml:ro
      - ./infra/minio/app-policy.template.json:/config/app-policy.template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        sed "s|__ORIGIN__|$${S3_ALLOWED_ORIGIN}|g" /config/cors.template.xml > /tmp/cors.xml;
        sed "s|__BUCKET__|$${S3_BUCKET}|g" /config/app-policy.template.json > /tmp/app-policy.json;
        mc mb --ignore-existing "local/$${S3_BUCKET}";
        mc cors set "local/$${S3_BUCKET}" /tmp/cors.xml;
        mc admin policy info local sudoku-app >/dev/null 2>&1 || mc admin policy create local sudoku-app /tmp/app-policy.json;
        mc admin user info local "$${S3_ACCESS_KEY_ID}" >/dev/null 2>&1 || mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}";
        mc admin policy attach local sudoku-app --user "$${S3_ACCESS_KEY_ID}";

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sudoku:${POSTGRES_PASSWORD:-local-sudoku-password}@postgres:5432/sudoku
      REDIS_URL: redis://redis:6379/0
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_COOKIE_NAME: sudoku_session
      SESSION_TTL_DAYS: "30"
      SECURE_COOKIES: "false"
      S3_BUCKET: ${S3_BUCKET:-sudoku-assets}
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sudoku-local-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-sudoku-app-secret-change-me}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
      WEB_PUSH_ALLOWED_HOSTS: push.apple.com,fcm.googleapis.com,push.services.mozilla.com
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sudoku-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://sudoku:${POSTGRES_PASSWORD:-local-sudoku-password}@postgres:5432/sudoku
      REDIS_URL: redis://redis:6379/0
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_COOKIE_NAME: sudoku_session
      SESSION_TTL_DAYS: "30"
      SECURE_COOKIES: "false"
      S3_BUCKET: ${S3_BUCKET:-sudoku-assets}
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sudoku-local-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-sudoku-app-secret-change-me}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
      WEB_PUSH_ALLOWED_HOSTS: push.apple.com,fcm.googleapis.com,push.services.mozilla.com
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sudoku-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
