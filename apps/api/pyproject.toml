[project]
name = "sudoku-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25,<26",
  "redis>=6,<7",
  "celery>=5.5,<6",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.40,<2",
  "pywebpush>=2.0,<3",
  "filetype>=1.2,<2",
  "email-validator>=2.2,<3",
  "structlog>=25,<26",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
  "opentelemetry-instrumentation-redis>=0.65b0,<1",
  "opentelemetry-instrumentation-celery>=0.65b0,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
