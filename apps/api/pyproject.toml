[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25,<26",
  "redis>=6,<7",
  "celery>=5.6.3,<6",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.40,<2",
  "pywebpush>=2.0,<3",
  "filetype>=1.2,<2",
  "email-validator>=2.2,<3",
  "structlog>=25,<26",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
  "opentelemetry-instrumentation-redis>=0.65b0,<1",
  "opentelemetry-instrumentation-celery>=0.65b0,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "moto[server]>=5,<6",
  "ruff>=0.13,<1",
  "pip-audit>=2.9,<3"
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
